name: Compilar Apex Kiosk APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android Oficial
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Aceitar Licenças do Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: 5. Compilar o Arquivo APK
        run: |
          if [ -d "ApexKioskBrowser" ]; then
            cd ApexKioskBrowser
          fi
          gradle assembleDebug --no-daemon --stacktrace

      - name: 6. Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: ApexKioskBrowser-Veicular-v1.0.0
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
